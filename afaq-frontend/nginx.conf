# ============================================================================
# إعدادات Nginx للواجهة الأمامية وتوجيه مسارات الـ API للباك إند
# ============================================================================
server {
    listen 80;
    server_name afaq-global.amrodev.com localhost;

    # تمكين ضغط Gzip لتسريع التصفح وتحميل الصفحات
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # مجلد الملفات المبنية للواجهة الأمامية React
    root /usr/share/nginx/html;
    index index.html;

    # 1. توجيه جميع طلبات الـ API إلى حاوية الـ Backend
    location /api/ {
        proxy_pass http://afaq_backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 2. توجيه جميع صفحات تطبيق React (SPA Fallback)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 3. تخزين الملفات الثابتة والصور بالمتصفح بكفاءة
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # معالجة أخطاء الصفحات
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
