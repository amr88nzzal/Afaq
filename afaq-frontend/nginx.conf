# ============================================================================
# إعدادات Nginx للواجهة الأمامية وتوجيه مسارات الـ API للباك إند
# ============================================================================
# بيئة النشر المعتمدة: Cloudflare Tunnel + Zero Trust
#   السيرفر لا يقبل أي اتصال وارد؛ cloudflared يفتح اتصالاً صادراً إلى
#   Cloudflare، وTLS يُنهى على حافة Cloudflare. لذلك:
#     ✅ لا حاجة لشهادة TLS على السيرفر ولا لبلوك 443.
#     ✅ لا حاجة لتحويل http→https داخل nginx (Cloudflare يتولاه).
#     ✅ أهم من ذلك: يجب الحفاظ على X-Forwarded-Proto القادمة من Cloudflare.
#
# ملاحظات أمنية على هذه النسخة:
#   - رؤوس حماية على كل الاستجابات.
#   - client_max_body_size (كان الافتراضي 1MB بينما Express يقبل 15MB،
#     فكانت كل مستندات الطلاب الأكبر من 1MB تفشل بـ 413).
#   - server_tokens off لإخفاء إصدار nginx.

# الحفاظ على X-Forwarded-Proto كما وردت من Cloudflare، والرجوع إلى $scheme
# فقط إذا لم تكن موجودة (وصول مباشر محلي). بدون هذا الـ map يعتقد الخادم أن
# كل الطلبات HTTP حتى وهي HTTPS.
map $http_x_forwarded_proto $afaq_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name afaq-global.amrodev.com localhost;

    # إخفاء إصدار nginx من الترويسات وصفحات الأخطاء
    server_tokens off;

    # الحد الأقصى لحجم الطلب — مطابق لحد Express (15MB) مع هامش بسيط
    client_max_body_size 16m;

    # رؤوس الحماية
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS يُضاف فقط عندما يصل الطلب عبر HTTPS فعلاً (تضبطه Cloudflare
    # أو مُنهي TLS الخارجي في ترويسة X-Forwarded-Proto)
    set $hsts "";
    if ($http_x_forwarded_proto = "https") {
        set $hsts "max-age=63072000; includeSubDomains";
    }
    add_header Strict-Transport-Security $hsts always;

    # تمكين ضغط Gzip لتسريع التصفح وتحميل الصفحات
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # مجلد الملفات المبنية للواجهة الأمامية React
    root /usr/share/nginx/html;
    index index.html;

    # 1. توجيه جميع طلبات الـ API إلى حاوية الـ Backend
    location /api/ {
        proxy_pass http://afaq_backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ⚠️ يجب تمرير X-Forwarded-Proto كما وردت من Cloudflare، لا استبدالها بـ $scheme.
        # كان السطر السابق `proxy_set_header X-Forwarded-Proto $scheme;` يستبدل
        # القيمة "https" القادمة من Cloudflare بـ "http" (لأن ربط cloudflared
        # بالحاوية محلي)، فيفقد الخادم معرفة أن الطلب أصله HTTPS — وهذا يُفسد
        # req.secure وترويسة HSTS وأي منطق يعتمد على اكتشاف HTTPS.
        proxy_set_header X-Forwarded-Proto $afaq_forwarded_proto;
        # ترويسات Cloudflare تُمرَّر كما هي (CF-Connecting-IP يحتاجها محدّد المعدّل)
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 2. توجيه مجلد الصور والمستندات الثابتة مباشرة
    location /images/ {
        alias /usr/share/nginx/html/images/;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. ⛔ منع الوصول المباشر لأي ملف مرفوع من الطلاب.
    # المستندات المرفوعة تحتوي جوازات سفر وكشوف درجات، وتُنزَّل حصراً
    # عبر /api/applications/:id/documents/:docId/file بعد التحقق من الملكية.
    location /uploads/ {
        return 404;
    }

    # 4. تخزين الملفات الثابتة والصور بالمتصفح بكفاءة
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 5. توجيه جميع صفحات تطبيق React (SPA Fallback)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # معالجة أخطاء الصفحات
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ============================================================================
# إعداد TLS — بيئتك هي (أ): Cloudflare Tunnel + Zero Trust
# ============================================================================
#
# (أ) Cloudflare Tunnel  ← ✅ هذا وضعك
#     الاتصال مشفّر بالكامل بلا أي شهادة على السيرفر:
#       المتصفح ──TLS──> حافة Cloudflare ──نفق مشفّر──> cloudflared ──محلي──> nginx
#     الجزء الوحيد غير المشفّر هو cloudflared → nginx داخل نفس المضيف/شبكة
#     Docker، ولا يمرّ على أي شبكة خارجية إطلاقاً.
#
#     ✅ المطلوب منك:
#        1. فعّل "Always Use HTTPS" من Cloudflare (SSL/TLS ← Edge Certificates).
#        2. فعّل HSTS من Cloudflare وليس من هنا، وابدأ بمدة قصيرة ثم زدها:
#           SSL/TLS ← Edge Certificates ← HTTP Strict Transport Security.
#        3. فعّل Minimum TLS Version = 1.2 على الأقل.
#        4. لا تحتاج أي بلوك 443 في هذا الملف — اتركه كما هو.
#
#     ✅ تحسين مستحسن (يُلغي آخر منفذ منشور):
#        إن كان cloudflared يعمل كحاوية في نفس شبكة Docker، فأزل `ports`
#        من خدمة afaq_frontend في docker-compose.yml ووجّه الـ tunnel إلى:
#            http://afaq_frontend:80
#        وبذلك تصبح صفر منافذ منشورة على المضيف.
#
#     💡 Zero Trust: يمكنك إضافة سياسة Cloudflare Access على مسارات الإدارة
#        (مثل /#admin أو /api/users*) كطبقة تحقق ثانية قبل وصول الطلب إلينا.
#        لا تعتمد عليها وحدها — المصادقة داخل التطبيق تبقى الأساس.
#
# (ب) إن أنهيت TLS على السيرفر نفسه (لا يناسب Tunnel):
#     1. صكّ الشهادة:  certbot certonly --standalone -d afaq-global.amrodev.com
#     2. أضف المجلد إلى خدمة الواجهة في docker-compose.yml:
#          volumes:
#            - /etc/letsencrypt:/etc/letsencrypt:ro
#     3. أضف المنفذ "443:443" في قسم ports.
#     4. أزل التعليق عن البلوك التالي وأضف التحويل من 80 إلى 443.
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name afaq-global.amrodev.com;
#
#     ssl_certificate     /etc/letsencrypt/live/afaq-global.amrodev.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/afaq-global.amrodev.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers on;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     server_tokens off;
#     client_max_body_size 16m;
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#     # ... انسخ باقي إعدادات location من البلوك أعلاه ...
# }
#
# server {
#     listen 80;
#     server_name afaq-global.amrodev.com;
#     return 301 https://$host$request_uri;
# }
