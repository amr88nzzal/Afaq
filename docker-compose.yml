version: '3.8'

services:
  # -------------------------------------------------------------
  # خدمة قاعدة البيانات PostgreSQL
  # -------------------------------------------------------------
  afaq_db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    container_name: afaq_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - afaq_pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - afaq_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # خدمة خادم الـ API (Express Backend)
  # -------------------------------------------------------------
  afaq_backend:
    build:
      context: .
      dockerfile: ./afaq-backend/Dockerfile
    container_name: afaq_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL
      - GMAIL_USER
      - GMAIL_APP_PASSWORD
      - ADMIN_NOTIFICATION_EMAILS
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
    depends_on:
      afaq_db:
        condition: service_healthy
    networks:
      - afaq_internal_net

  # -------------------------------------------------------------
  # خدمة الواجهة الأمامية (Nginx Frontend)
  # -------------------------------------------------------------
  afaq_frontend:
    build:
      context: .
      dockerfile: ./afaq-frontend/Dockerfile
    container_name: afaq_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - afaq_backend
    networks:
      - afaq_internal_net

# الشبكات الداخلية
networks:
  afaq_internal_net:
    driver: bridge

# مساحة تخزين قاعدة البيانات المستمرة
volumes:
  afaq_pgdata:
