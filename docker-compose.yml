version: '3.8'

services:
  # -------------------------------------------------------------
  # خدمة قاعدة البيانات PostgreSQL
  # -------------------------------------------------------------
  afaq_db:
    image: postgres:16-alpine
    # ⛔ أُزيل نشر المنفذ 5432 على المضيف.
    # كان `ports: ["5432:5432"]` ينشر قاعدة البيانات على كل واجهات الشبكة،
    # وهذا يُلغي عزل الشبكة الداخلية ويجعل القاعدة قابلة للوصول من الإنترنت
    # مباشرة متجاوزاً التطبيق وnginx.
    # الحاويات تتواصل عبر afaq_internal_net، فلا حاجة لنشر المنفذ إطلاقاً.
    # إن احتجت pgAdmin من جهازك مؤقتاً، اربطه بـ localhost فقط:
    #   ports:
    #     - "127.0.0.1:5432:5432"
    container_name: afaq_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - afaq_pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - afaq_internal_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # خدمة خادم الـ API (Express Backend)
  # -------------------------------------------------------------
  afaq_backend:
    build:
      context: .
      dockerfile: ./afaq-backend/Dockerfile
    container_name: afaq_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL
      - PG_SSL
      - INITIAL_ADMIN_PASSWORD
      - GMAIL_USER
      - GMAIL_APP_PASSWORD
      - ADMIN_NOTIFICATION_EMAILS
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
    volumes:
      # مجلد المستندات المرفوعة: خارج public/ فلا يمكن الوصول إليه كملف ثابت.
      # التنزيل يمرّ حصراً عبر مسار مُصرَّح يتحقق من ملكية الطلب.
      - afaq_uploads:/app/server/data/uploads
    depends_on:
      afaq_db:
        condition: service_healthy
    networks:
      - afaq_internal_net
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------
  # خدمة الواجهة الأمامية (Nginx Frontend)
  # -------------------------------------------------------------
  afaq_frontend:
    build:
      context: .
      dockerfile: ./afaq-frontend/Dockerfile
    container_name: afaq_frontend
    restart: unless-stopped
    # بيئة النشر: Cloudflare Tunnel + Zero Trust (لا اتصال وارد إلى السيرفر).
    #
    # 💡 تحسين مستحسن: إن كان cloudflared يعمل كحاوية في نفس الشبكة
    #    (afaq_internal_net)، فأزل هذا القسم بالكامل ووجّه الـ tunnel إلى:
    #        http://afaq_frontend:80
    #    وبذلك تصبح صفر منافذ منشورة على المضيف — وهو الوضع الأمثل مع Tunnel.
    #
    #    وإن كان cloudflared يعمل على المضيف مباشرة (خارج Docker)، فأبقِ
    #    الربط على localhost فقط بدل نشره على كل الواجهات:
    #        ports:
    #          - "127.0.0.1:3000:80"
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - afaq_backend
    networks:
      - afaq_internal_net
    security_opt:
      - no-new-privileges:true

# الشبكات الداخلية
networks:
  afaq_internal_net:
    driver: bridge

# مساحات التخزين المستمرة
volumes:
  afaq_pgdata:
  afaq_uploads:
