# ============================================================================
#  إعداد نفق Cloudflare لمنصة آفاق العالمية
#  Cloudflare Tunnel configuration for Afaq Global
# ============================================================================
#
#  مكان الملف على السيرفر:  /etc/cloudflared/config.yml
#  (أو اربطه كـ volume في حاوية cloudflared)
#
#  ⚠️ لا تضع التوكن أو محتوى credentials.json في هذا الملف ولا في Git.
#     الملف يُشار إليه بمساره فقط، والمحتوى يبقى على السيرفر بصلاحيات 600.
# ============================================================================

# اسم أو معرّف النفق كما أنشأته:
#   cloudflared tunnel create afaq-global
tunnel: afaq-global

# ملف اعتماد النفق الذي أنشأه الأمر أعلاه.
# على السيرفر: /etc/cloudflared/<TUNNEL-UUID>.json  (صلاحيات 600)
credentials-file: /etc/cloudflared/REPLACE_WITH_TUNNEL_UUID.json

# لا تُحدّث cloudflared تلقائياً على السيرفر — التحديث يجب أن يكون مقصوداً
# ومُراجَعاً، لا أن يحدث أثناء وقت الذروة.
no-autoupdate: true

# مستوى التسجيل: debug | info | warn | error | fatal
loglevel: info

# ----------------------------------------------------------------------------
#  قواعد التوجيه (Ingress)
# ----------------------------------------------------------------------------
#  كل ما يصل إلى النفق يُوجَّه إلى خدمة محلية. لا يُفتح أي منفذ على المضيف.
#  إن كانت cloudflared تعمل كحاوية في نفس شبكة afaq_internal_net،
#  فاسم الخدمة هو اسم الحاوية: http://afaq_frontend:80
#  وإن كانت تعمل على المضيف مباشرة، استخدم: http://127.0.0.1:3000
# ----------------------------------------------------------------------------

ingress:
  # ---- التطبيق (الواجهة + الـ API) ----
  # ملاحظة: لا نضع قواعد منفصلة لمسارات الإدارة هنا؛ التحكم في الوصول
  # يحدث في Zero Trust Access (لوحة التحكم) وليس في هذا الملف.
  # السبب: قواعد Access تُطبَّق قبل وصول الطلب إلى السيرفر إطلاقاً.
  - hostname: afaq-global.amrodev.com
    service: http://afaq_frontend:80
    originRequest:
      # Cloudflare → cloudflared → nginx كلها داخل نفس المضيف/الشبكة
      connectTimeout: 30s
      # المهلة الأخيرة: رفع مستندات الطلاب قد يستغرق وقتاً (حد 10MB)
      tlsTimeout: 10s
      keepAliveTimeout: 90s
      # لا تتحقق من شهادة TLS للمصدر — الاتصال داخلي بلا TLS أصلاً
      noTLSVerify: false
      # أرسل اسم المضيف الأصلي حتى يطابق server_name في nginx
      httpHostHeader: afaq-global.amrodev.com
      # لا تُخزّن استجابات الـ API في كاش Cloudflare
      disableChunkedEncoding: false

  # ---- النطاق الرئيسي (اختياري): أعد التوجيه إلى نفس التطبيق ----
  # - hostname: amrodev.com
  #   service: http://afaq_frontend:80

  # ---- قاعدة إلزامية أخيرة: أي مضيف غير مذكور يُرفض ----
  # بدون هذه القاعدة يُرفض الطلب برسالة عامة غير واضحة.
  - service: http_status:404
