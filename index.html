<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="آفاق العالمية | Afaq Global Education" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('afaq_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-amber-500 selection:text-slate-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
